name: applywise_app
description: "ApplyWise - AI Resume Optimizer"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # HTTP & API
  http: ^1.2.0
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
    
  # Utils
  intl: ^0.19.0
  jwt_decoder: ^2.0.1
  uuid: ^3.0.7
  
  # UI
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  
  # URL Launcher (for web checkout)
  url_launcher: ^6.2.4
  
  # Loading indicators
  flutter_spinkit: ^5.2.0
  purchases_flutter: ^9.10.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/explain_ats/
    - assets/images/onbording/
    - assets/icons/
