name: applywise_app
description: "ApplyWise - AI Resume Optimizer"
publish_to: 'none'
version: 1.3.1+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # HTTP & API
  http: ^1.2.0
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
    
  # Utils
  intl: ^0.19.0
  jwt_decoder: ^2.0.1
  uuid: ^3.0.7
  
  # UI
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  
  # URL Launcher (for web checkout)
  url_launcher: ^6.2.4
  # In-app WebView for cookie policy
  webview_flutter: ^4.7.0
  
  # Loading indicators
  flutter_spinkit: ^5.2.0
  shimmer: ^3.0.0
  purchases_flutter: ^9.10.7
  purchases_ui_flutter: ^9.10.7

  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.3
  path_provider: ^2.1.4

  # File Picker (PDF import)
  file_picker: ^8.1.2

  # Social Authentication
  sign_in_with_apple: ^6.1.0
  google_sign_in: ^6.2.1
  
  # Home Widget (iOS)
  home_widget: ^0.9.0

  # Push Notifications
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

  # Analytics
  firebase_analytics: ^11.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/explain_ats/
    - assets/images/onbording/
    - assets/icons/
